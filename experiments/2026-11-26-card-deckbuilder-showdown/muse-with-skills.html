<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:," />
    <title>深渊牌局 · 卡牌构筑</title>
    <style>
      :root{
        color-scheme: dark;
        --bg:#0d0b09;
        --bg2:#171310;
        --panel:rgba(24,19,15,.92);
        --panel-solid:#1b1611;
        --line:#3d3226;
        --line-soft:#2c241b;
        --ink:#efe6d8;
        --ink-dim:#b8a98f;
        --ink-faint:#8a7c64;
        --gold:#e0a83c;
        --gold-hi:#f6c860;
        --ember:#e2543a;
        --blood:#c33b2e;
        --blood-hi:#ef6a55;
        --arcane:#4f9db8;
        --arcane-hi:#7cc4dd;
        --venom:#7fae4c;
        --hp:#b8402f;
        --hp-hi:#e2604a;
        --block:#5b87a8;
        --energy:#e8b23a;
        --card-w:158px;
        --card-h:222px;
        --radius:14px;
        --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
        --font-display:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
      }
      @media (prefers-color-scheme: light){
        :root{
          color-scheme: light;
          --bg:#e9e2d4;
          --bg2:#ddd2bd;
          --panel:rgba(250,245,234,.94);
          --panel-solid:#faf5ea;
          --line:#b39b6d;
          --line-soft:#cdbb96;
          --ink:#2b2118;
          --ink-dim:#5d4f3a;
          --ink-faint:#8a7a5c;
        }
      }
      *{box-sizing:border-box}
      html,body{margin:0;padding:0}
      body{
        font-family:var(--font-body);
        background:var(--bg);
        color:var(--ink);
        min-height:100dvh;
        -webkit-tap-highlight-color:transparent;
      }
      button{font-family:inherit;min-height:2.75rem;cursor:pointer}
      button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

      /* ---------- backdrop ---------- */
      .backdrop{
        position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
      }
      .backdrop img{
        width:100%;height:100%;object-fit:cover;object-position:center 30%;
        filter:saturate(.92) brightness(.62);
      }
      .backdrop::after{
        content:"";position:absolute;inset:0;
        background:
          radial-gradient(120% 60% at 50% 0%, transparent 30%, var(--bg) 96%),
          linear-gradient(180deg, rgba(0,0,0,.25), transparent 22%, transparent 55%, var(--bg) 98%);
      }
      @media (prefers-color-scheme: light){
        .backdrop img{filter:saturate(.85) brightness(1.05) opacity(.35)}
        .backdrop::after{background:linear-gradient(180deg, transparent 40%, var(--bg) 96%)}
      }

      .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:14px 14px 40px}

      /* ---------- top bar ---------- */
      .topbar{
        display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
        background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:10px 14px;backdrop-filter:blur(6px);
      }
      .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
      .brand h1{
        font-family:var(--font-display);font-size:1.35rem;margin:0;letter-spacing:.14em;
        color:var(--gold-hi);white-space:nowrap;
      }
      .brand .sub{font-size:.78rem;color:var(--ink-dim);letter-spacing:.06em;white-space:nowrap}
      .top-actions{display:flex;gap:8px;flex-wrap:wrap}
      .btn{
        border:1px solid var(--line);background:var(--panel-solid);color:var(--ink);
        border-radius:10px;padding:8px 14px;font-size:.88rem;letter-spacing:.04em;
        transition:border-color .15s, transform .15s, background .15s;
      }
      .btn:hover{border-color:var(--gold);transform:translateY(-1px)}
      .btn:active{transform:translateY(0)}
      .btn.primary{
        background:linear-gradient(180deg,#8a2f22,#6d2115);border-color:#a5503c;color:#ffe9d9;
        font-weight:700;
      }
      .btn.primary:hover{border-color:var(--gold-hi)}
      .btn.gold{
        background:linear-gradient(180deg,#a5762a,#7d5518);border-color:#c99b45;color:#fff6dd;font-weight:700;
      }
      .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

      /* ---------- status strip ---------- */
      .status{
        display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
        margin-top:10px;background:var(--panel);border:1px solid var(--line);
        border-radius:var(--radius);padding:10px 14px;backdrop-filter:blur(6px);
      }
      .hp-block{flex:1 1 240px;min-width:200px}
      .hp-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-dim);margin-bottom:5px}
      .hp-label b{color:var(--ink);font-size:.9rem}
      .bar{height:12px;border-radius:7px;background:rgba(0,0,0,.45);border:1px solid var(--line-soft);overflow:hidden}
      @media (prefers-color-scheme: light){.bar{background:rgba(60,40,10,.18)}}
      .bar > i{display:block;height:100%;border-radius:7px;transition:width .45s cubic-bezier(.22,.8,.3,1)}
      .bar.hp > i{background:linear-gradient(90deg,var(--hp),var(--hp-hi))}
      .bar.enemy > i{background:linear-gradient(90deg,#7c2d8e,#b45fd0)}
      @media (prefers-color-scheme: light){.bar.enemy > i{background:linear-gradient(90deg,#8e44ad,#b45fd0)}}
      .stat-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
      .chip{
        display:inline-flex;align-items:center;gap:6px;font-size:.85rem;
        border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--panel-solid);
      }
      .chip svg{width:15px;height:15px;flex:none}
      .chip b{font-size:.95rem}
      .chip.gold b{color:var(--gold-hi)}
      .chip.block b{color:var(--arcane-hi)}
      @media (prefers-color-scheme: light){.chip.block b{color:#2f6d8f}.chip.gold b{color:#8a5f10}}
      .relics{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
      .relic{
        width:34px;height:34px;border-radius:9px;border:1px solid var(--gold);
        background:linear-gradient(160deg,rgba(224,168,60,.22),rgba(224,168,60,.05));
        display:inline-flex;align-items:center;justify-content:center;position:relative;
      }
      .relic svg{width:19px;height:19px}
      .relic .tip{
        position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(4px);
        width:190px;background:var(--panel-solid);border:1px solid var(--gold);border-radius:10px;
        padding:8px 10px;font-size:.76rem;line-height:1.5;color:var(--ink);opacity:0;pointer-events:none;
        transition:opacity .15s, transform .15s;z-index:30;text-align:left;
      }
      .relic:hover .tip,.relic:focus .tip{opacity:1;transform:translateX(-50%) translateY(0)}
      .relic .tip b{display:block;color:var(--gold-hi);font-size:.82rem;margin-bottom:2px}

      /* ---------- map ---------- */
      .map{
        margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:12px 16px 10px;backdrop-filter:blur(6px);
      }
      .map-head{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--ink-dim);margin-bottom:10px}
      .map-head b{color:var(--ink);font-size:.88rem;letter-spacing:.05em}
      .map-track{display:flex;align-items:flex-start;gap:0}
      .node{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;min-width:0}
      .node::before{
        content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;
        background:var(--line-soft);z-index:0;
      }
      .node:first-child::before{display:none}
      .node.done::before{background:var(--gold)}
      .node .dot{
        width:27px;height:27px;border-radius:50%;border:2px solid var(--line);background:var(--panel-solid);
        display:flex;align-items:center;justify-content:center;z-index:1;position:relative;
      }
      .node .dot svg{width:14px;height:14px}
      .node .lbl{font-size:.66rem;color:var(--ink-faint);letter-spacing:.02em;text-align:center;line-height:1.25}
      .node.done .dot{border-color:var(--gold);background:rgba(224,168,60,.18)}
      .node.current .dot{border-color:var(--ember);box-shadow:0 0 0 4px rgba(226,84,58,.22);animation:pulse 1.6s ease-in-out infinite}
      .node.current .lbl{color:var(--ember);font-weight:700}
      .node.boss .dot{width:33px;height:33px;border-color:#8e44ad}
      .node.boss .dot svg{width:18px;height:18px}
      .node.boss.current .dot{border-color:#c86ee0;box-shadow:0 0 0 5px rgba(160,80,200,.25)}
      @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

      /* ---------- arena ---------- */
      .arena{
        margin-top:10px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;
      }
      .fighter{
        background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:14px;backdrop-filter:blur(6px);position:relative;overflow:hidden;
      }
      .fighter.enemy{border-color:#5d3a63}
      .fighter .who{display:flex;align-items:center;gap:12px}
      .avatar{
        width:58px;height:58px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;
        border:1px solid var(--line);
      }
      .avatar svg{width:36px;height:36px}
      .avatar.player{background:linear-gradient(160deg,rgba(224,168,60,.25),rgba(224,168,60,.04))}
      .avatar.foe{background:linear-gradient(160deg,rgba(142,68,173,.3),rgba(142,68,173,.05));border-color:#6d4378}
      .fighter h2{font-family:var(--font-display);font-size:1.12rem;margin:0 0 3px;letter-spacing:.06em}
      .fighter .role{font-size:.76rem;color:var(--ink-dim)}
      .fighter .bar{margin-top:10px}
      .intent{
        margin-top:11px;display:flex;align-items:center;gap:8px;font-size:.86rem;
        border:1px dashed #8a5a44;border-radius:10px;padding:7px 10px;background:rgba(226,84,58,.08);
      }
      .intent svg{width:17px;height:17px;flex:none}
      .intent b{color:var(--blood-hi)}
      @media (prefers-color-scheme: light){.intent b{color:#a02c1e}}
      .intent.calm{border-color:var(--line);background:transparent}
      .intent.calm b{color:var(--ink)}
      .fx-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;min-height:24px}
      .fx{
        font-size:.74rem;border-radius:999px;padding:3px 9px;border:1px solid var(--line);
        background:var(--panel-solid);display:inline-flex;gap:4px;align-items:center;
      }
      .fx.bad{border-color:#8a4a3a;color:var(--blood-hi)}
      .fx.good{border-color:#5d7a3a;color:#a5cc72}
      @media (prefers-color-scheme: light){.fx.bad{color:#a02c1e}.fx.good{color:#4c7020}}
      .vs{
        align-self:center;font-family:var(--font-display);font-size:1.5rem;color:var(--gold);
        text-shadow:0 2px 10px rgba(0,0,0,.5);letter-spacing:.1em;
      }
      .shake{animation:shake .38s ease}
      @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-4px)}}
      .flash-red{animation:flashred .4s ease}
      @keyframes flashred{0%{box-shadow:inset 0 0 0 3px rgba(226,84,58,.9)}100%{box-shadow:inset 0 0 0 0 transparent}}
      .float-num{
        position:absolute;font-weight:800;font-size:1.35rem;pointer-events:none;z-index:5;
        text-shadow:0 2px 6px rgba(0,0,0,.75);animation:floatup 1s ease-out forwards;font-variant-numeric:tabular-nums;
      }
      @keyframes floatup{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-46px) scale(1)}}

      /* ---------- hand & controls ---------- */
      .controls{
        margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
      }
      .energy-row{display:flex;align-items:center;gap:10px}
      .energy-orbs{display:flex;gap:5px}
      .orb{
        width:26px;height:26px;border-radius:50%;border:2px solid #8a6a20;
        background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--energy) 55%,#a5762a);
        box-shadow:0 0 8px rgba(232,178,58,.45);
      }
      .orb.spent{background:rgba(0,0,0,.35);box-shadow:none;border-color:var(--line-soft)}
      @media (prefers-color-scheme: light){.orb.spent{background:rgba(60,40,10,.15)}}
      .energy-num{font-size:.9rem;color:var(--ink-dim)}
      .energy-num b{color:var(--ink);font-size:1.05rem}
      .piles{display:flex;gap:8px}
      .pile-btn{
        display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
        background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:.85rem;
        backdrop-filter:blur(6px);
      }
      .pile-btn:hover{border-color:var(--gold)}
      .pile-btn b{font-size:1rem}
      .endturn{font-size:1rem;padding:12px 26px;border-radius:12px}

      .hand{
        margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
        min-height:calc(var(--card-h) + 14px);padding:6px 2px 2px;
      }
      .hand-empty{
        color:var(--ink-faint);font-size:.9rem;align-self:center;padding:30px 0;letter-spacing:.05em;
      }

      /* ---------- cards ---------- */
      .card{
        width:var(--card-w);height:var(--card-h);flex:none;position:relative;text-align:left;
        border-radius:13px;padding:0;border:1px solid var(--line);color:var(--ink);
        background:linear-gradient(168deg,#2b2119,#1a140f 60%,#14100c);
        box-shadow:0 8px 18px rgba(0,0,0,.45);
        transition:transform .16s ease, box-shadow .16s ease, border-color .16s;
        display:flex;flex-direction:column;overflow:hidden;
      }
      @media (prefers-color-scheme: light){
        .card{background:linear-gradient(168deg,#fdf8ec,#f3e9d2 60%,#eadfc4);box-shadow:0 8px 18px rgba(90,60,10,.25)}
      }
      .card::before{
        content:"";position:absolute;inset:5px;border:1px solid rgba(224,168,60,.28);border-radius:9px;pointer-events:none;
      }
      .card:hover:not(:disabled){transform:translateY(-12px) scale(1.04);box-shadow:0 18px 30px rgba(0,0,0,.55);z-index:4}
      .card:disabled{cursor:not-allowed;filter:grayscale(.55) brightness(.75)}
      @media (prefers-color-scheme: light){.card:disabled{filter:grayscale(.55) brightness(.94)}}
      .card .cost{
        position:absolute;top:8px;left:8px;width:31px;height:31px;border-radius:50%;z-index:2;
        background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--energy) 55%,#a5762a);
        color:#3a2803;font-weight:800;font-size:1.02rem;display:flex;align-items:center;justify-content:center;
        border:2px solid #8a6a20;box-shadow:0 2px 6px rgba(0,0,0,.4);
      }
      .card .cname{
        font-family:var(--font-display);font-weight:700;font-size:1rem;letter-spacing:.05em;
        text-align:center;padding:13px 30px 0;line-height:1.25;min-height:2.6em;
        display:flex;align-items:center;justify-content:center;
      }
      .card .art{
        margin:2px 14px 0;height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;
        border:1px solid var(--line-soft);
      }
      .card .art svg{width:38px;height:38px}
      .card.t-attack .art{background:linear-gradient(160deg,rgba(195,59,46,.32),rgba(195,59,46,.06))}
      .card.t-skill .art{background:linear-gradient(160deg,rgba(79,157,184,.3),rgba(79,157,184,.05))}
      .card.t-power .art{background:linear-gradient(160deg,rgba(224,168,60,.32),rgba(224,168,60,.05))}
      .card .ctext{
        font-size:.8rem;line-height:1.55;color:var(--ink-dim);text-align:center;
        padding:9px 12px 4px;flex:1;
      }
      .card .ctext b{color:var(--ink)}
      .card .cfoot{
        display:flex;justify-content:space-between;align-items:center;padding:0 12px 10px;
        font-size:.68rem;letter-spacing:.14em;color:var(--ink-faint);
      }
      .card .rarity{font-weight:700}
      .card.r-uncommon{border-color:#4d7d99}
      .card.r-uncommon .rarity{color:var(--arcane-hi)}
      .card.r-rare{border-color:var(--gold);box-shadow:0 8px 22px rgba(224,168,60,.28)}
      .card.r-rare .rarity{color:var(--gold-hi)}
      @media (prefers-color-scheme: light){
        .card.r-uncommon .rarity{color:#2f6d8f}
        .card.r-rare .rarity{color:#8a5f10}
      }
      .card.pickable{cursor:pointer}
      .card.pickable:hover{transform:translateY(-10px) scale(1.05);border-color:var(--gold-hi)}
      .card.mini{--card-w:118px;--card-h:168px;cursor:default}
      .card.mini:hover{transform:none}
      .card.mini .cname{font-size:.82rem;padding-top:10px}
      .card.mini .art{height:42px;margin:0 10px}
      .card.mini .art svg{width:26px;height:26px}
      .card.mini .ctext{font-size:.68rem;padding:6px 8px 2px}
      .card.mini .cost{width:24px;height:24px;font-size:.85rem;top:6px;left:6px}

      /* ---------- log ---------- */
      .log{
        margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:10px 14px;backdrop-filter:blur(6px);
      }
      .log h3{margin:0 0 6px;font-size:.8rem;letter-spacing:.14em;color:var(--ink-faint);font-weight:600}
      .log ul{margin:0;padding:0;list-style:none;font-size:.84rem;line-height:1.65;color:var(--ink-dim);max-height:118px;overflow-y:auto}
      .log li b{color:var(--ink)}
      .log li.hurt{color:var(--blood-hi)}
      .log li.good{color:#a5cc72}
      @media (prefers-color-scheme: light){.log li.hurt{color:#a02c1e}.log li.good{color:#4c7020}}

      /* ---------- overlay screens ---------- */
      .overlay{
        position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
        background:rgba(8,6,4,.72);padding:16px;overflow-y:auto;
      }
      .overlay.open{display:flex}
      .sheet{
        width:100%;max-width:860px;background:var(--panel-solid);border:1px solid var(--gold);
        border-radius:18px;padding:26px 22px;text-align:center;margin:auto;
        box-shadow:0 30px 80px rgba(0,0,0,.6);
      }
      .sheet h2{font-family:var(--font-display);font-size:1.7rem;margin:0 0 6px;letter-spacing:.1em;color:var(--gold-hi)}
      .sheet .lead{color:var(--ink-dim);font-size:.94rem;margin:0 0 20px;line-height:1.7}
      .choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
      .sheet .foot-actions{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
      .relic-choice{
        width:200px;border:1px solid var(--gold);border-radius:14px;background:var(--panel);
        padding:18px 14px;color:var(--ink);text-align:center;transition:transform .15s, box-shadow .15s;
      }
      .relic-choice:hover{transform:translateY(-6px);box-shadow:0 16px 30px rgba(0,0,0,.45)}
      .relic-choice svg{width:44px;height:44px;margin-bottom:8px}
      .relic-choice b{display:block;font-size:1rem;margin-bottom:5px;color:var(--gold-hi)}
      .relic-choice span{font-size:.82rem;color:var(--ink-dim);line-height:1.55;display:block}
      .result-stats{
        display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px;
      }
      .result-stats .chip{font-size:.92rem;padding:8px 14px}
      .deck-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-height:56dvh;overflow-y:auto;padding:6px 2px}
      .rules{text-align:left;max-width:560px;margin:0 auto;font-size:.9rem;line-height:1.9;color:var(--ink-dim)}
      .rules b{color:var(--ink)}
      .rules li{margin-bottom:2px}

      .toast{
        position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:60;
        background:var(--panel-solid);border:1px solid var(--gold);color:var(--ink);
        border-radius:999px;padding:10px 20px;font-size:.9rem;opacity:0;pointer-events:none;
        transition:opacity .25s, transform .25s;box-shadow:0 12px 30px rgba(0,0,0,.5);white-space:nowrap;
      }
      .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

      @media (max-width:760px){
        :root{--card-w:104px;--card-h:158px}
        .wrap{padding:10px 10px 32px}
        .brand h1{font-size:1.12rem}
        .brand .sub{display:none}
        .arena{grid-template-columns:1fr 1fr;gap:8px}
        .vs{display:none}
        .fighter{padding:10px}
        .avatar{width:44px;height:44px;border-radius:10px}
        .avatar svg{width:27px;height:27px}
        .fighter h2{font-size:.95rem}
        .card .cname{font-size:.78rem;padding:10px 22px 0;min-height:2.5em}
        .card .art{height:40px;margin:0 10px}
        .card .art svg{width:25px;height:25px}
        .card .ctext{font-size:.66rem;padding:6px 8px 2px;line-height:1.5}
        .card .cost{width:24px;height:24px;font-size:.85rem;top:6px;left:6px}
        .card .cfoot{font-size:.58rem;padding:0 9px 7px}
        .hand{gap:7px;min-height:172px}

var S = null;

function makeCard(id){ return {uid:uidSeq++, id:id}; }
function starterDeck(){
  return ["strike","strike","strike","strike","defend","defend","defend","defend","heavy"].map(makeCard);
}
function newGame(){
  uidSeq = 1;
  S = {
    screen:"combat",
    floor:0, turn:1, gold:0, kills:0,
    player:{ hp:75, maxHp:75, block:0, strength:0, thorns:0 },
    deck: starterDeck(),
    drawPile:[], hand:[], discard:[], exhaustPile:[],
    energy:3, maxEnergy:3,
    relics:[],
    enemy:null, moveIdx:0, busy:false
  };
  startBattle();
  log("你踏入深渊。手牌即是武器，构筑即是命运。");
  render();

function hasRelic(id){ return S.relics.indexOf(id)>=0; }
function strBonus(){ return S.player.strength + (hasRelic("whetstone")?2:0); }

/* ================= 战斗流程 ================= */
function startBattle(){
  var def = ENEMIES[PATH[S.floor].enemyIdx];
  S.enemy = { def:def, hp:def.hp, maxHp:def.hp, block:0, strength:0, vuln:0 };
  S.moveIdx = 0;
  S.turn = 1;
  S.player.block = 0; S.player.strength = 0; S.player.thorns = 0;
  S.drawPile = shuffle(S.deck.slice());
  S.hand = []; S.discard = []; S.exhaustPile = [];
  if(hasRelic("belt")){ S.player.strength += 1; }
  if(hasRelic("ring")){ S.player.thorns += 3; }
  if(hasRelic("boots")){ S.player.block += 8; }
  startTurn(true);
}
function startTurn(first){
  S.player.block = first ? S.player.block : 0;
  if(!first){ /* 格挡在回合开始清零（首回合保留遗物格挡） */ }
  S.maxEnergy = 3 + (hasRelic("core")?1:0);
  S.energy = S.maxEnergy;
  drawCards(5 + (hasRelic("clover")?1:0));
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function drawCards(n){
  for(var i=0;i<n;i++){
    if(S.drawPile.length===0){
      if(S.discard.length===0) break;
      S.drawPile = shuffle(S.discard); S.discard = [];
      log("弃牌堆洗回抽牌堆。");
    }
    if(S.hand.length>=10) break;
    S.hand.push(S.drawPile.pop());
  }
}
function currentMove(){ return S.enemy.def.moves[S.moveIdx % S.enemy.def.moves.length]; }

function playCard(uid){
  if(S.busy || S.screen!=="combat") return;
  var idx = -1;
  for(var i=0;i<S.hand.length;i++) if(S.hand[i].uid===uid){ idx=i; break; }
  if(idx<0) return;
  var inst = S.hand[idx], def = CARDS[inst.id];
  if(def.cost > S.energy){ toast("能量不足"); return; }
  S.energy -= def.cost;
  S.hand.splice(idx,1);
  log("打出 <b>"+def.name+"</b>。");
  def.play();
  if(def.type==="power" || def.exhaust){ S.exhaustPile.push(inst); }
  else { S.discard.push(inst); }
  render();
  if(S.enemy.hp<=0){ onVictory(); return; }
  if(S.player.hp<=0){ onDefeat(); }
}

function hitEnemy(base, hits){
  var totalDealt = 0;
  for(var h=0; h<hits; h++){
    if(S.enemy.hp<=0) break;
    var dmg = base + S.player.strength;
    if(S.enemy.vuln>0) dmg = Math.floor(dmg*1.5);
    var blocked = Math.min(S.enemy.block, dmg);
    S.enemy.block -= blocked;
    var real = dmg - blocked;
    S.enemy.hp -= real;
    totalDealt += real;
    floatNum(document.getElementById("enemy-box"), "-"+real, "#ef6a55");
    shakeEl("enemy-box");
  }
  if(hits>1) log("共造成 <b>"+totalDealt+"</b> 点伤害。");
  else if(totalDealt>0) log("对 "+S.enemy.def.name+" 造成 <b>"+totalDealt+"</b> 点伤害。");
  return totalDealt;
}
function applyVuln(n){ S.enemy.vuln += n; log(S.enemy.def.name+" 获得 "+n+" 层易伤（受伤 +50%）。"); }
function addStrength(n){ S.player.strength += n; log("力量 +"+n+"（当前 "+S.player.strength+"）。","good"); }
function gainBlock(n){ S.player.block += n; }
function healPlayer(n){
  if(n<=0) return;
  var real = Math.min(n, S.player.maxHp - S.player.hp);
  S.player.hp += real;
  if(real>0){ log("回复 <b>"+real+"</b> 点生命。","good"); floatNum(document.getElementById("player-box"), "+"+real, "#a5cc72"); }
}
function loseHpRaw(n){ /* 无视格挡的自损 */
  S.player.hp -= n;
  log("你失去了 "+n+" 点生命。","hurt");
  floatNum(document.getElementById("player-box"), "-"+n, "#ef6a55");
}

function endTurn(){
  if(S.busy || S.screen!=="combat") return;
  S.busy = true;
  /* 未打出的手牌进弃牌堆 */
  while(S.hand.length){ S.discard.push(S.hand.pop()); }
  render();
  setTimeout(enemyAct, 420);
}
function enemyAct(){
  var mv = currentMove(), e = S.enemy;
  if(mv.kind==="atk"){
    var hits = mv.hits||1;
    for(var h=0; h<hits; h++){
      var dmg = Math.max(0, mv.dmg + e.strength);
      var blocked = Math.min(S.player.block, dmg);
      S.player.block -= blocked;
      var real = dmg - blocked;
      S.player.hp -= real;
      if(real>0){
        log(e.def.name+" 攻击造成 <b>"+real+"</b> 点伤害。","hurt");
        floatNum(document.getElementById("player-box"), "-"+real, "#ef6a55");
        flashEl("player-box");
        if(S.player.thorns>0 && e.hp>0){
          var tb = Math.min(e.block, S.player.thorns); e.block -= tb;
          var tr = S.player.thorns - tb; e.hp -= tr;
          if(tr>0) log("荆棘反弹 <b>"+tr+"</b> 点伤害。","good");
        }
      } else {
        log("攻击被格挡完全挡下。");
      }
      if(S.player.hp<=0 || e.hp<=0) break;
    }
  } else if(mv.kind==="def"){
    e.block += mv.block;
    log(e.def.name+" 获得 "+mv.block+" 点格挡。");
  } else if(mv.kind==="buff"){
    e.strength += mv.str;
    log(e.def.name+" 力量 +"+mv.str+"，气势攀升。","hurt");
  }
  if(e.vuln>0) e.vuln -= 1;
  S.moveIdx += 1;
  S.busy = false;
  render();
  if(S.enemy.hp<=0){ onVictory(); return; }
  if(S.player.hp<=0){ onDefeat(); return; }
  S.turn += 1;
  S.player.block = 0;
  startTurn(false);
  render();
}

/* ================= 胜负与奖励 ================= */
function onVictory(){
  S.screen = "reward";
  S.kills += 1;
  var goldGain = S.enemy.def.boss ? 150 : (S.enemy.def.elite ? 60+Math.floor(Math.random()*21) : 25+Math.floor(Math.random()*16));
  if(hasRelic("coin")) goldGain += 25;
  S.gold += goldGain;
  log("<b>"+S.enemy.def.name+"</b> 被击败！获得 "+goldGain+" 金币。","good");
  render();
  if(S.enemy.def.boss){ showEnding(true); return; }
  showCardReward(goldGain);
}
function onDefeat(){
  S.screen = "over";
  log("你倒在了第 "+(S.floor+1)+" 层……","hurt");
  render();
  showEnding(false);
}
function rewardPool(){
  var ids = Object.keys(CARDS).filter(function(id){ return CARDS[id].rarity!=="starter"; });
  var picks = [];
  var guard = 0;
  while(picks.length<3 && guard++<60){
    var r = Math.random();
    var want = r<0.55 ? "common" : (r<0.86 ? "uncommon" : "rare");
    var cand = ids.filter(function(id){ return CARDS[id].rarity===want && picks.indexOf(id)<0; });
    if(!cand.length) cand = ids.filter(function(id){ return picks.indexOf(id)<0; });
    picks.push(cand[Math.floor(Math.random()*cand.length)]);
  }
  return picks;
}
function showCardReward(goldGain){
  var picks = rewardPool();
  var sheet = document.getElementById("sheet");
  var html = "<h2>战 利 品</h2>"
    + "<p class='lead'>击败 <b style='color:var(--ink)'>"+S.enemy.def.name+"</b>，获得 <b style='color:var(--gold-hi)'>"+goldGain+" 金币</b>。三选一，将一张牌加入你的牌组——构筑的方向，由你决定。</p>"
    + "<div class='choices'>"
    + picks.map(function(id){ return cardHtml(makeCard(id), "pickable", "pickCard('"+id+"')"); }).join("")
    + "</div>"
    + "<div class='foot-actions'>"
    + "<button class='btn' type='button' onclick='skipReward()'>跳过选牌 · 回复 6 点生命</button>"
    + "</div>";
  sheet.innerHTML = html;
  openOverlay();
}
function pickCard(id){
  S.deck.push(makeCard(id));
  toast("「"+CARDS[id].name+"」已加入牌组");
  closeOverlay();
  afterReward();
}
function skipReward(){
  healPlayer(6);
  closeOverlay();
  afterReward();
}
function afterReward(){
  /* 精英战后给遗物三选一 */
  if(S.enemy.def.elite){ showRelicReward(); return; }
  advanceFloor();
}
function showRelicReward(){
  var owned = S.relics;
  var pool = Object.keys(RELICS).filter(function(id){ return owned.indexOf(id)<0; });
  shuffle(pool);
  var picks = pool.slice(0,3);
  if(!picks.length){ advanceFloor(); return; }
  S.screen = "relic";
  var sheet = document.getElementById("sheet");
  sheet.innerHTML = "<h2>精 英 遗 物</h2>"
    + "<p class='lead'>堕落者的遗物在黑暗中发光。选择一件带走，它将永久改变你的战斗方式。</p>"
    + "<div class='choices'>"
    + picks.map(function(id){
        var r = RELICS[id];
        return "<button class='relic-choice' type='button' onclick='pickRelic(\""+id+"\")'>"+icon(r.icon)+"<b>"+r.name+"</b><span>"+r.desc+"</span></button>";
      }).join("")
    + "</div>";
  openOverlay();
  render();
}
function pickRelic(id){
  S.relics.push(id);
  if(RELICS[id].onTake) RELICS[id].onTake();
  toast("获得遗物「"+RELICS[id].name+"」");
  closeOverlay();
  advanceFloor();
}
function advanceFloor(){
  S.floor += 1;
  S.screen = "combat";
  startBattle();
  log("—— 第 "+(S.floor+1)+" 层："+S.enemy.def.name+" ——");
  render();
}
function showEnding(won){
  var sheet = document.getElementById("sheet");
  var title = won ? "王 座 易 主" : "深 渊 吞 没";
  var lead = won
    ? "瓦尔戈斯庞大的身躯在王座上崩塌。你踩着余烬登上台阶——这一局，你用亲手构筑的牌组，改写了深渊的结局。"
    : "第 "+(S.floor+1)+" 层的黑暗合拢上来。但牌组还在，经验还在——重整构筑，再来一局。";
  sheet.innerHTML = "<h2>"+title+"</h2>"
    + "<p class='lead'>"+lead+"</p>"
    + "<div class='result-stats'>"
    + "<span class='chip'>到达层数 <b>"+(S.floor+1)+" / "+PATH.length+"</b></span>"
    + "<span class='chip'>击败敌人 <b>"+S.kills+"</b></span>"
    + "<span class='chip gold'>金币 <b>"+S.gold+"</b></span>"
    + "<span class='chip'>最终牌组 <b>"+S.deck.length+" 张</b></span>"
    + "<span class='chip'>遗物 <b>"+S.relics.length+" 件</b></span>"
    + "</div>"
    + "<div class='foot-actions'>"
    + "<button class='btn gold' type='button' onclick='restartGame()'>再来一局</button>"
    + "<button class='btn' type='button' onclick='viewDeck()'>回看最终牌组</button>"
    + "</div>";
  openOverlay();
}
function restartGame(){ closeOverlay(); closeDeck(); newGame(); }

/* ================= 渲染 ================= */
function $(id){ return document.getElementById(id); }
function cardHtml(inst, extraCls, onclick){
  var def = CARDS[inst.id];
  var typeName = TYPE_LABEL[def.type];
  return "<button type='button' class='card t-"+def.type+" r-"+def.rarity+" "+(extraCls||"")+"'"
    + (onclick ? " onclick=\""+onclick+"\"" : "")
    + " aria-label='"+def.name+"，费用 "+def.cost+"，"+def.text().replace(/<[^>]+>/g,"")+"'>"
    + "<span class='cost'>"+def.cost+"</span>"
    + "<span class='cname'>"+def.name+"</span>"
    + "<span class='art'>"+icon(def.icon)+"</span>"
    + "<span class='ctext'>"+def.text()+"</span>"
    + "<span class='cfoot'><span>"+typeName+"</span><span class='rarity'>"+RARITY_LABEL[def.rarity]+"</span></span>"
    + "</button>";
}
function fxChips(list){
  return list.map(function(f){
    return "<span class='fx "+(f.cls||"")+"'>"+f.label+" <b>"+f.val+"</b></span>";
  }).join("");
}
function render(){
  /* 顶部状态 */
  $("hp-text").textContent = Math.max(0,S.player.hp)+" / "+S.player.maxHp;
  $("hp-fill").style.width = Math.max(0, S.player.hp/S.player.maxHp*100)+"%";
  $("block-num").textContent = S.player.block;
  $("gold-num").textContent = S.gold;
  $("turn-num").textContent = S.turn;
  $("draw-num").textContent = S.drawPile.length;
  $("discard-num").textContent = S.discard.length;
  /* 遗物 */
  $("relics").innerHTML = S.relics.length
    ? S.relics.map(function(id){ var r=RELICS[id];
        return "<span class='relic' tabindex='0'>"+icon(r.icon)+"<span class='tip'><b>"+r.name+"</b>"+r.desc+"</span></span>";
      }).join("")
    : "<span style='font-size:.78rem;color:var(--ink-faint)'>遗物：暂无（击败精英敌人获得）</span>";
  /* 地图 */
  $("map-track").innerHTML = PATH.map(function(p,i){
    var def = ENEMIES[p.enemyIdx];
    var cls = "node"+(p.boss?" boss":"")+(i<S.floor?" done":(i===S.floor?" current":""));
    var dotIcon = p.boss ? ICONS.crown : (def.elite ? ICONS.skull : ICONS.sword);
    return "<div class='"+cls+"'><span class='dot'>"+dotIcon+"</span><span class='lbl'>"+p.label+"<br>"+def.name+"</span></div>";
  }).join("");
  /* 玩家状态效果 */
  var pfx = [];
  if(S.player.strength>0) pfx.push({label:"力量", val:S.player.strength, cls:"good"});
  if(S.player.thorns>0) pfx.push({label:"荆棘", val:S.player.thorns, cls:"good"});
  if(S.player.block>0) pfx.push({label:"格挡", val:S.player.block});
  $("player-fx").innerHTML = pfx.length ? fxChips(pfx) : "<span style='font-size:.78rem;color:var(--ink-faint)'>无状态效果</span>";
  /* 敌人 */
  var e = S.enemy;
  $("enemy-name").textContent = e.def.name;
  $("enemy-role").textContent = e.def.role;
  $("enemy-avatar").innerHTML = icon(e.def.icon);
  $("enemy-hp-fill").style.width = Math.max(0, e.hp/e.maxHp*100)+"%";
  $("enemy-hp-text").textContent = "生命 "+Math.max(0,e.hp)+" / "+e.maxHp;
  $("enemy-block-text").textContent = e.block>0 ? "格挡 "+e.block : "";
  var mv = currentMove();
  var intentHtml, intentCls = "intent";
  if(mv.kind==="atk"){
    var per = Math.max(0, mv.dmg + e.strength);
    intentHtml = ICONS.intent_atk + "<span>意图：攻击 <b>"+per+"</b>"+(mv.hits? " × "+mv.hits+" 次" : "")+"</span>";
  } else if(mv.kind==="def"){
    intentHtml = ICONS.intent_def + "<span>意图：获得 <b>"+mv.block+"</b> 点格挡</span>"; intentCls += " calm";
  } else if(mv.kind==="buff"){
    intentHtml = ICONS.intent_buff + "<span>意图：强化自身，力量 <b>+"+mv.str+"</b></span>"; intentCls += " calm";
  }
  var ib = $("intent-box"); ib.className = intentCls; ib.innerHTML = intentHtml;
  var efx = [];
  if(e.strength>0) efx.push({label:"力量", val:e.strength, cls:"bad"});
  if(e.vuln>0) efx.push({label:"易伤", val:e.vuln+" 回合", cls:"bad"});
  if(e.block>0) efx.push({label:"格挡", val:e.block});
  $("enemy-fx").innerHTML = efx.length ? fxChips(efx) : "<span style='font-size:.78rem;color:var(--ink-faint)'>无状态效果</span>";
  renderEnergy();
  renderHand();
  $("btn-endturn").disabled = S.busy || S.screen!=="combat";
}
function renderEnergy(){
  var orbs = "";
  for(var i=0;i<S.maxEnergy;i++) orbs += "<span class='orb"+(i<S.energy?"":" spent")+"'></span>";
  $("energy-orbs").innerHTML = orbs;
  $("energy-num").textContent = S.energy+"/"+S.maxEnergy;
}
function renderHand(){
  var hand = $("hand");
  if(!S.hand.length){
    hand.innerHTML = "<div class='hand-empty'>手牌已打完 — 点击「结束回合」</div>";
    return;
  }
  hand.innerHTML = S.hand.map(function(inst){
    var def = CARDS[inst.id];
    var dis = (def.cost > S.energy || S.busy || S.screen!=="combat") ? " disabled" : "";
    return cardHtml(inst, "", null).replace("<button", "<button data-uid='"+inst.uid+"'"+dis);
  }).join("");
  var btns = hand.querySelectorAll("button[data-uid]");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click", function(){ playCard(parseInt(this.getAttribute("data-uid"),10)); });
  }
}

/* ================= 日志 / 动效 / 弹层 ================= */
var logLines = [];
function log(html, cls){
  logLines.push({html:html, cls:cls||""});
  if(logLines.length>40) logLines.shift();
  var ul = $("log-list");
  ul.innerHTML = logLines.map(function(l){ return "<li class='"+l.cls+"'>"+l.html+"</li>"; }).join("");
  ul.scrollTop = ul.scrollHeight;
}
function shakeEl(id){ var el=$(id); el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function flashEl(id){ var el=$(id); el.classList.remove("flash-red"); void el.offsetWidth; el.classList.add("flash-red"); }
function floatNum(box, text, color){
  if(!box) return;
  var s = document.createElement("span");
  s.className = "float-num"; s.textContent = text; s.style.color = color;
  s.style.left = (30+Math.random()*40)+"%"; s.style.top = "18%";
  box.appendChild(s);
  setTimeout(function(){ s.remove(); }, 1000);
}
var toastTimer = null;
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function openOverlay(){ $("overlay").classList.add("open"); }
function closeOverlay(){ $("overlay").classList.remove("open"); }
function viewDeck(){
  closeOverlay();
  var counts = {};
  S.deck.forEach(function(c){ counts[c.id]=(counts[c.id]||0)+1; });
  var ids = Object.keys(counts).sort(function(a,b){ return CARDS[a].cost-CARDS[b].cost; });
  $("deck-title").textContent = "我的牌组 · 共 "+S.deck.length+" 张";
  $("deck-note").textContent = "构筑决定上限：攻击、防御、过牌与力量的配比，就是你的打法。";
  $("deck-grid").innerHTML = ids.map(function(id){
    var html = cardHtml(makeCard(id), "mini", null);
    if(counts[id]>1) html = html.replace("class='card", "data-n='"+counts[id]+"' class='card");
    return html + "";
  }).join("");
  /* 数量角标 */
  var grid = $("deck-grid");
  ids.forEach(function(id, i){
    if(counts[id]>1){
      var el = grid.children[i];
      el.style.position = "relative";
      var badge = document.createElement("span");
      badge.textContent = "×"+counts[id];
      badge.style.cssText = "position:absolute;top:-8px;right:-6px;background:var(--gold);color:#3a2803;font-weight:800;font-size:.78rem;border-radius:999px;padding:2px 8px;z-index:3;box-shadow:0 3px 8px rgba(0,0,0,.4)";
      el.appendChild(badge);
    }
  });
  $("deck-overlay").classList.add("open");
}
function closeDeck(){ $("deck-overlay").classList.remove("open"); }
function showRules(){
  var sheet = $("sheet");
  sheet.innerHTML = "<h2>玩 法</h2>"
    + "<ul class='rules'>"
    + "<li><b>目标：</b>沿深渊之路连过 7 层，击败最终 Boss「深渊君主」。</li>"
    + "<li><b>出牌：</b>每回合 3 点能量（费用在卡牌左上角），点击手牌即可打出；每回合抽 5 张，回合结束弃掉剩余手牌。</li>"
    + "<li><b>格挡：</b>抵挡等量伤害，<b>你的回合开始时清零</b>——别囤，算好敌人的意图再防。</li>"
    + "<li><b>敌人意图：</b>敌人头顶会预告下一次行动（攻击数值已含其力量加成），针对性出牌是通关关键。</li>"
    + "<li><b>易伤：</b>使敌人受到的攻击伤害 +50%，持续到层数耗尽。</li>"
    + "<li><b>构筑：</b>每胜一场三选一加牌（或跳过回血）；击败<b>精英</b>敌人额外获得一件永久遗物。牌不是越多越好——精简牌组更容易抽到核心牌。</li>"
    + "<li><b>力量：</b>每点力量让你的每段攻击伤害 +1，多段攻击收益翻倍。</li>"
    + "</ul>"
    + "<div class='foot-actions'><button class='btn gold' type='button' onclick='closeOverlay()'>开始战斗</button></div>";
  openOverlay();
}
function showPile(which){
  var pile = which==="draw" ? S.drawPile : S.discard;
  var sheet = $("sheet");
  if(!pile.length){
    sheet.innerHTML = "<h2>"+(which==="draw"?"抽牌堆":"弃牌堆")+"</h2><p class='lead'>这里是空的。</p>"
      + "<div class='foot-actions'><button class='btn gold' type='button' onclick='closeOverlay()'>返回</button></div>";
  } else {
    var sorted = pile.slice().sort(function(a,b){ return CARDS[a.id].cost-CARDS[b.id].cost; });
    sheet.innerHTML = "<h2>"+(which==="draw"?"抽牌堆":"弃牌堆")+" · "+pile.length+" 张</h2>"
      + "<p class='lead'>"+(which==="draw"?"顺序随机，抽到什么看构筑与运气。":"回合结束或打出的牌会来到这里，抽牌堆耗尽时洗回。")+"</p>"
      + "<div class='deck-grid'>"+sorted.map(function(c){ return cardHtml(c,"mini",null); }).join("")+"</div>"
      + "<div class='foot-actions'><button class='btn gold' type='button' onclick='closeOverlay()'>返回</button></div>";
  }
  openOverlay();
}

/* ================= 事件绑定 ================= */
$("btn-endturn").addEventListener("click", endTurn);
$("btn-restart").addEventListener("click", function(){ restartGame(); toast("新的一局开始"); });
$("btn-rules").addEventListener("click", showRules);
$("btn-deck-top").addEventListener("click", viewDeck);
$("btn-deck-close").addEventListener("click", function(){
  closeDeck();
  if(S && (S.screen==="over" || (S.enemy && S.enemy.def.boss && S.enemy.hp<=0))) showEnding(S.kills>=PATH.length);
  else if(S && S.screen==="reward") { /* 奖励层已关闭时不重开 */ }
});
$("btn-drawpile").addEventListener("click", function(){ showPile("draw"); });
$("btn-discardpile").addEventListener("click", function(){ showPile("discard"); });
document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){ closeDeck(); }
});

newGame();
</script>
  </body>
</html>
